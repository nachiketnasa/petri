apiVersion: apps/v1
kind: Deployment
metadata:
  name: petri-frontend
  namespace: petri
  labels:
    app: petri-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petri-frontend
  template:
    metadata:
      labels:
        app: petri-frontend
    spec:
      containers:
        - name: petri-frontend
          image: petri-frontend:local
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: petri-frontend
  namespace: petri
spec:
  selector:
    app: petri-frontend
  ports:
    - port: 80
      targetPort: 80
