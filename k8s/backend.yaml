apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: petri-backend-data
  namespace: petri
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petri-backend
  namespace: petri
  labels:
    app: petri-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petri-backend
  template:
    metadata:
      labels:
        app: petri-backend
    spec:
      containers:
        - name: petri-backend
          image: petri-backend:local
          ports:
            - containerPort: 8091
          env:
            - name: DATABASE_URL
              value: sqlite:////data/petri.db
            - name: CORS_ORIGINS
              value: "http://localhost:5173,http://localhost:5183,http://localhost:8088"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /docs
              port: 8091
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /docs
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: petri-backend-data
---
apiVersion: v1
kind: Service
metadata:
  name: petri-backend
  namespace: petri
spec:
  selector:
    app: petri-backend
  ports:
    - port: 8091
      targetPort: 8091
